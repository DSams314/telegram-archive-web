# Runs the test suite on GitHub's own fresh machines every time code is pushed.
#
# The point is the "fresh" part: these machines have never seen the program, so
# anything that only works on the machine it was built on shows up here.
#
# This includes the web version's own guarantees -- that its in-browser indexer
# matches the reference indexer file for file (test_web_parity, which needs
# Node), and that the page can only read your exports, write its one settings
# file, and reach nowhere but its own site (test_web_safety).
#
# Nothing here publishes anything; publishing is publish.yml.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the tests
        run: python -m unittest discover -s tools/tests -t . -v
