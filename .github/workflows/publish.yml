# Publishes the website to GitHub Pages.
#
# It runs the full test suite first and publishes nothing if anything fails.
# Those tests include the ones that matter most for the web version: that its
# in-browser indexer builds exactly what the reference indexer builds
# (test_web_parity), and that the page cannot write outside its settings file,
# cannot reach any other website, and only reads your exports (test_web_safety).
#
# It only runs when the repository variable PUBLISH_SITE is set to true, so
# turning the website off is a one-line change (set it to false).

name: publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the tests
        run: python -m unittest discover -s tools/tests -t . -v
      - name: Build the website
        run: python tools/build_site.py
        env:
          # Set once the custom domain's DNS is ready; empty means no domain.
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
